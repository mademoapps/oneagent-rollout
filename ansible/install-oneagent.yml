- name: Install Dynatrace OneAgent
  hosts: all
  become: true
  order: sorted
  gather_facts: false
  serial: [1, "25%", "100%"]
  max_fail_percentage: 10
  pre_tasks:
    - name: Wait until the server answers (a new server takes a minute)
      ansible.builtin.wait_for_connection: { timeout: 300 }
    - name: Wait for first-boot setup to finish
      ansible.builtin.command: cloud-init status --wait
      changed_when: false
      failed_when: false
    - name: Gather facts
      ansible.builtin.setup:
    - name: Check whether the agent is already installed
      ansible.builtin.stat: { path: /opt/dynatrace/oneagent/agent/tools/oneagentctl }
      register: agent_before
  roles:
    - role: dynatrace.oneagent.oneagent
      vars:
        # New servers get the tags from group_vars/all.yml at install time
        oneagent_platform_install_args: "{{ host_tags | map('regex_replace', '^', '--set-host-tag=') | list }}"
  post_tasks:
    - name: Read the agent's current tags
      ansible.builtin.command: /opt/dynatrace/oneagent/agent/tools/oneagentctl --get-host-tags
      register: tags_now
      changed_when: false
    - name: Make the tags match Git (only runs when they differ)
      ansible.builtin.command:
        argv: >-
          {{ ['/opt/dynatrace/oneagent/agent/tools/oneagentctl']
             + (tags_to_add | map('regex_replace', '^', '--set-host-tag=') | list)
             + (tags_to_remove | map('regex_replace', '^', '--remove-host-tag=') | list)
             + ['--restart-service'] }}
      vars:
        tags_to_add: "{{ host_tags | difference(tags_now.stdout_lines) }}"
        tags_to_remove: "{{ tags_now.stdout_lines | difference(host_tags) }}"
      when: (tags_to_add + tags_to_remove) | length > 0
      changed_when: true
    - name: Read service states
      ansible.builtin.service_facts:
    - name: Confirm the agent is running
      ansible.builtin.assert:
        that: ansible_facts.services['oneagent.service'].state == 'running'
        fail_msg: "OneAgent is NOT running on {{ inventory_hostname }}"
        success_msg: "OneAgent is running on {{ inventory_hostname }}"
    - name: Restart the app so it is fully monitored (first install, Dev and Test only)
      ansible.builtin.service: { name: nginx, state: restarted }
      when:
        - restart_apps_after_install | bool
        - not agent_before.stat.exists
        