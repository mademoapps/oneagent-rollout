# Kubernetes: the Dynatrace Operator runs inside the cluster and puts the agent
# on every node, including new ones. Settings live in Git, like the servers.
apiVersion: dynatrace.com/v1beta5       # match the Operator release you install
kind: DynaKube
metadata:
  name: dynakube
  namespace: dynatrace
spec:
  apiUrl: https://<env-id>.live.dynatrace.com/api
  oneAgent:
    hostGroup: acme-k8s-dev             # same naming rule as the servers
    cloudNativeFullStack: {}
  activeGate:
    capabilities:
      - kubernetes-monitoring