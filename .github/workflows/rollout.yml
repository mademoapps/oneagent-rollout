name: OneAgent rollout
run-name: "OneAgent rollout (${{ inputs.change_ticket || github.event.head_commit.message }})"

on:
  workflow_dispatch:              # the "Run workflow" button
    inputs:
      change_ticket:
        description: "Approved change ticket"
        required: true
        default: "CHG0001234"
  push:
    branches: [main]
    paths: ["terraform/envs/**", "ansible/**"]

permissions:
  contents: read

concurrency:
  group: oneagent-rollout          # only one rollout at a time
  cancel-in-progress: false

jobs:
  dev:
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: dev
    secrets: inherit

  test:
    needs: dev
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: test
    secrets: inherit

  prod:
    needs: test
    uses: ./.github/workflows/deploy-stage.yml
    with:
      environment: prod
    secrets: inherit